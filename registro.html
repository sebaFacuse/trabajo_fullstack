<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Perfumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <main class="container my-5 d-flex justify-content-center">
        <div class="card shadow p-4" style="width: 100%; max-width: 800px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-primary mb-2"></i>
                <h2 class="fw-bold">Crea tu cuenta</h2>
                <p class="text-muted">Únete a nuestra comunidad de amantes de los perfumes</p>
            </div>

            <div id="mensajeExitoRegistro" class="alert alert-success d-none text-center" role="alert">
                ¡Cuenta creada con éxito! Bienvenido a Perfumes Árabes.
            </div>

            <form id="formRegistro" novalidate>
                <div class="row">
                    <!-- Columna Izquierda -->
                    <div class="col-md-6 mb-3">
                        <label for="rutRegistro" class="form-label">RUN (Sin puntos ni guion)</label>
                        <input type="text" class="form-control" id="rutRegistro" placeholder="Ej: 19011022K">
                        <div class="invalid-feedback" id="errorRut"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="correoRegistro" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correoRegistro" placeholder="ejemplo@duoc.cl">
                        <div class="invalid-feedback" id="errorCorreo"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nombreRegistro" class="form-label">Nombres</label>
                        <input type="text" class="form-control" id="nombreRegistro">
                        <div class="invalid-feedback" id="errorNombre"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="apellidoRegistro" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="apellidoRegistro">
                        <div class="invalid-feedback" id="errorApellido"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="passRegistro" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="passRegistro" placeholder="4 a 10 caracteres">
                        <div class="invalid-feedback" id="errorPass"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="passConfRegistro" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="passConfRegistro">
                        <div class="invalid-feedback" id="errorPassConf"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="fechaNacRegistro" class="form-label">Fecha de Nacimiento (Opcional)</label>
                        <input type="date" class="form-control" id="fechaNacRegistro">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="regionRegistro" class="form-label">Región</label>
                        <select class="form-select" id="regionRegistro">
                            <option value="">-- Seleccione una región --</option>
                        </select>
                        <div class="invalid-feedback" id="errorRegion"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="comunaRegistro" class="form-label">Comuna</label>
                        <select class="form-select" id="comunaRegistro" disabled>
                            <option value="">-- Seleccione una comuna --</option>
                        </select>
                        <div class="invalid-feedback" id="errorComuna"></div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="direccionRegistro" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="direccionRegistro" placeholder="Calle, número, depto">
                        <div class="invalid-feedback" id="errorDireccion"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Registrarse</button>
                
                <div class="text-center mt-3">
                    <span class="text-muted">¿Ya tienes cuenta?</span> 
                    <a href="login.html" class="text-decoration-none fw-bold">Inicia sesión</a>
                </div>
            </form>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
