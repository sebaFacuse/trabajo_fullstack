<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Perfumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="arabes.html">Árabes</a></li>
                    <li class="nav-item"><a class="nav-link" href="diseñador.html">Diseñador</a></li>
                    <li class="nav-item"><a class="nav-link" href="nicho.html">Nichos</a></li>
                    <li class="nav-item"><a class="nav-link" href="tiendas.html">Tiendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-circle fa-3x text-primary mb-2"></i>
                <h2 class="fw-bold">inicia tu sesion</h2>
                <p class="text-muted">Inicio de sesión</p>
            </div>

            <div id="mensajeExitoLogin" class="alert alert-success d-none text-center" role="alert">
                ¡Sesión iniciada con éxito! Redirigiendo...
            </div>

            <form id="formLogin" novalidate>
                <div class="mb-3">
                    <label for="correoLogin" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="correoLogin" placeholder="ejemplo@duoc.cl">
                    <div class="invalid-feedback" id="errorCorreoLogin"></div>
                </div>
                
                <div class="mb-4">
                    <label for="passLogin" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passLogin" placeholder="••••••••">
                    <div class="invalid-feedback" id="errorPassLogin"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Iniciar Sesión</button>
                
                <div class="text-center">
                    <span class="text-muted">¿No tienes cuenta?</span> 
                    <a href="registro.html" class="text-decoration-none fw-bold">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
