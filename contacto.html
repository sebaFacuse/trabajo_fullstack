<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Perfumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="arabes.html">Árabes</a></li>
                    <li class="nav-item"><a class="nav-link" href="diseñador.html">Diseñador</a></li>
                    <li class="nav-item"><a class="nav-link" href="nicho.html">Nichos</a></li>
                    <li class="nav-item"><a class="nav-link" href="tiendas.html">Tiendas</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a></li>
                </ul>
                <button class="btn btn-dark position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
                    🛒 Carrito
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 600px;">
        <h1 class="text-center mb-4 fw-bold">Contáctanos</h1>
        <form onsubmit="event.preventDefault();">
            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombreUsuario" required>
            </div>
            <div class="mb-3">
                <label for="apellidoUsuario" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellidoUsuario" required>
            </div>
            <div class="mb-3">
                <label for="telefonoUsuario" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefonoUsuario">
            </div>
            <div class="mb-3">
                <label for="emailInput" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="emailInput" required>
            </div>
            <div class="mb-3">
                <label for="mensajeInput" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensajeInput" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="footer-top-bar">PAGO 100% PROTEGIDO</div>
        <div class="footer-bottom">
            <div class="footer-container">
                <p>© 2026 Perfumes. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasCarritoLabel">Mi Carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="lista-carrito" class="list-group list-group-flush mb-auto">
                <li class="list-group-item text-muted text-center py-4">El carrito está vacío</li>
            </ul>
            <div class="border-top pt-3">
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                    <span>Total:</span>
                    <span id="total-carrito">$0</span>
                </div>
                <button class="btn btn-dark w-100 rounded-0 py-2">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
