  <div class="container">
    <h1 class="text-center mt-4 mb-4">Contáctanos</h1>
    <form>
      <div class="mb-3">
        <label for="nombreUsuario" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombreUsuario">
      </div>
      <div class="mb-3">
        <label for="apellidoUsuario" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellidoUsuario">
      </div>
      <div class="mb-3">
        <label for="telefonoUsuario" class="form-label">Numero Telefono</label>
        <input type="number" class="form-control" id="telefonoUsuario">
      </div>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
