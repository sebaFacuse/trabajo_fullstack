<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Perfume - Lo Quieres, Te Lo Vendo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Lo Quieres, Te Lo Vendo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="arabes.html">Árabes</a></li>
                    <li class="nav-item"><a class="nav-link" href="diseñador.html">Diseñador</a></li>
                    <li class="nav-item"><a class="nav-link" href="nicho.html">Nichos</a></li>
                    <li class="nav-item"><a class="nav-link" href="tiendas.html">Tiendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <!-- Botón de apertura del Carrito -->
                <button class="btn btn-dark position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
                    🛒 Carrito
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico generado por js/detalle.js -->
    <main class="container my-5">
        <div id="detalle-producto" class="row"></div>
    </main>

    <footer class="text-center py-4 bg-light border-top">
        <p class="m-0">Desarrollado por Grupo de Trabajo | Año 2026</p>
    </footer>

    <!-- Panel Deslizable del Carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="offcanvasCarritoLabel">Mi Carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="lista-carrito" class="list-group list-group-flush mb-auto">
                <li class="list-group-item text-muted text-center py-4">El carrito está vacío</li>
            </ul>
            <div class="border-top pt-3">
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                    <span>Total:</span>
                    <span id="total-carrito">$0</span>
                </div>
                <button id="btn-finalizar-compra" class="btn btn-dark w-100 rounded-0 py-2">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
